<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Марио: Прыжки через препятствия</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div id="score">Счет: 0</div>
        <div id="mario"></div>
        <div id="obstacle"></div>
        
        <!-- Окно проигрыша с кнопкой -->
        <div id="game-over">
            <p>Игра окончена!</p>
            <p>Ваш счет: <span id="final-score">0</span></p>
            <button id="restart-btn">Начать заново</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
